version: '3'
services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.17.1
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_PASSWORD=${DB_PASSWORD:-localpassword}
      - SESSION_KEY=${SESSION_KEY:-defaultsessionkey}
    ports:
      - "7350:7350"  # gRPC
      - "7351:7351"  # HTTP
    volumes:
      - ./backend:/nakama/data/modules
    entrypoint: >
      /bin/sh -c "
      /nakama/nakama migrate up --database.address postgres:$$DB_PASSWORD@postgres:5432/nakama &&
      /nakama/nakama
      --database.address postgres:$$DB_PASSWORD@postgres:5432/nakama
      --logger.level INFO
      --session.token_expiry_sec 7200
      --socket.server_key $$SESSION_KEY
      --runtime.path /nakama/data/modules
      "
    restart: unless-stopped

volumes:
  postgres_data:
